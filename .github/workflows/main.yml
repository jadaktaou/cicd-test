name: Data Pipeline Testing (Python)

on: 
  push:
    branches: [ "main" ]

jobs:
  test-integridad:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Instalar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🔬 Ejecutar Test de Integridad GxP (ALCOA+)
        run: python test_procesador.py

      - name: 🚀 Desplegar en Producción
        # Este paso SOLO se ejecutará si el paso anterior no dio error
        run: echo "Tests pasados. Desplegando en la nube de Roche."
